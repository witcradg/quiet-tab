<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>quiet-tab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <h1>quiet-tab</h1>

    <form id="search-form">
      <input id="search-input" type="text" placeholder="Search or ask..." autofocus />
      <button type="submit">Go</button>
    </form>

    <section id="engine-row" aria-label="Search engines"></section>
    <section id="link-grid" aria-label="Shortcuts"></section>
  </main>

  <dialog id="add-dialog">
    <form id="add-form" method="dialog">
      <label>Label <input name="label" required autocomplete="off"></label>
      <label>URL <input name="url" type="url" required placeholder="https://" autocomplete="off"></label>
      <label>Icon <input name="icon" placeholder="emoji — blank = site favicon" autocomplete="off"></label>
      <div class="dialog-actions">
        <button type="button" id="add-delete" class="danger" hidden>Delete</button>
        <button type="button" id="add-cancel">Cancel</button>
        <button type="submit" id="add-submit">Add</button>
      </div>
    </form>
  </dialog>

  <script src="./config/settings.js"></script>
  <script src="./config/engines.js"></script>
  <script src="./config/links.js"></script>
  <script src="./app.js"></script>
</body>
</html>
